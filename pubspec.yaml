name: trackia
description: Bitácora de entrenamiento local para Android e iOS.
publish_to: none
version: 0.3.34+37
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.3
  file_picker: ^10.3.10
  image_picker: 1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  csv: ^6.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  flutter_secure_storage: 9.2.4
  speech_to_text: 7.0.0
  flutter_markdown_plus: 1.0.7
  crypto: ^3.0.6
  jose: ^0.3.5+2
  llama_cpp_dart:
    path: packages/llama_cpp_dart
  package_info_plus: ^9.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.5
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/trackia-logo.png
